[project]
name = "srag-agent"
version = "0.1.0"
description = "Agente de IA generativa que gera relatórios de SRAG com métricas (DATASUS) e notícias em tempo real"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "duckdb",
    "pandas",
    "matplotlib",
    "feedparser",
    "httpx",
    "trafilatura",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srag_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
